name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run unit tests
        run: ./build.sh native && ./build/native/test_core
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC x64)
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Unit tests
        run: build\Release\test_core.exe
      - name: Package
        run: cmake --install build --config Release --prefix dist\aes67-vsc-win64
      - uses: actions/upload-artifact@v4
        with:
          name: aes67-vsc-win64
          path: dist/aes67-vsc-win64
      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist\aes67-vsc-win64 -DestinationPath aes67-vsc-${{ github.ref_name }}-win64.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: aes67-vsc-${{ github.ref_name }}-win64.zip
          generate_release_notes: true
          body: |
            Windows x64 package (built with MSVC, static CRT, no redistributable needed).

            1. Unzip to a permanent folder, e.g. `C:\Program Files\AES67 VSC`.
            2. Right-click `install.bat` → Run as administrator.
            3. Select **AES67 Virtual Sound Card** as the ASIO device in your audio application and open `aes67vsc-panel.exe` to load / export SDP files.
